name: CI/CD

on:
  push:
  pull_request:

jobs:
 test:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - uses: actions/setup-python@v5
       with:
         python-version: '3.10'

     - name: Install dependencies
       run: python -m pip install -r requirements.txt

     - name: Install Playwright Chromium
       run: python -m playwright install --with-deps chromium

     - name: Run test suite
       run: |
         mkdir -p test-results
         python -m pytest --junitxml=test-results/junit.xml

 security:
   needs: test
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     
     - name: Build image
       run: docker build -t app:test .
     
     - name: Run Trivy vulnerability scanner
       uses: aquasecurity/trivy-action@master
       with:
         image-ref: 'app:test'
         format: 'table'
         exit-code: '1'
         ignore-unfixed: true
         severity: 'CRITICAL,HIGH'

 deploy:
   needs: security
   if: github.ref == 'refs/heads/main'
   runs-on: ubuntu-latest
   environment: production
   steps:
     - uses: actions/checkout@v4
     
     - uses: docker/setup-buildx-action@v3
     
     - uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}
         
     - uses: docker/build-push-action@v5
       with:
         push: true
         tags: |
           anutale/fa26-is601851-module8_webapplicationandtesting:latest
           anutale/fa26-is601851-module8_webapplicationandtesting:${{ github.sha }}
         platforms: linux/amd64,linux/arm64
         cache-from: type=registry,ref=anutale/fa26-is601851-module8_webapplicationandtesting:cache
         cache-to: type=inline,mode=max
